# Dev Containers compose for the web/UI service. Builds the `dev` stage of
# web/Dockerfile, which derives from the SAME base image as the production
# build stage, so the dev Node version never drifts from the build version.
# Vite proxies /api to VITE_API_PROXY_TARGET so a frontender can run against
# the API running on the host (host.docker.internal -> host loopback).
services:
  web:
    build:
      context: ../../web
      target: dev
    environment:
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/workspace
    working_dir: /workspace/web
    command: sleep infinity
